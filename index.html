<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<link rel="preload" href="slopkit/cat.jpg" as="image">
<link rel="preload" href="slopkit/mmhmm-cats-ps5.gif" as="image">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 28%, #18233a 0, #0c111b 44%, #07090e 100%);
    color: #c8ced8;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
  }
  #cat {
    box-sizing: border-box; width: 150px; height: 150px; object-fit: cover;
    max-width: 34vw; max-height: 34vw;
    border: 4px solid #343c49; border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  #actions {
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
  }
  .action {
    box-sizing: border-box; display: inline-block; min-width: 185px;
    padding: 17px 30px; border: 1px solid rgba(255,255,255,.22);
    border-radius: 15px; color: #fff;
    background: linear-gradient(135deg, #3b8cff, #1957c8);
    box-shadow: 0 12px 30px rgba(18,79,190,.32), inset 0 1px rgba(255,255,255,.22);
    font: 700 20px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .025em; text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .action:focus {
    outline: none; transform: translateY(-3px);
    border-color: #fff; box-shadow: 0 0 0 4px rgba(91,158,255,.3), 0 16px 36px rgba(18,79,190,.45);
  }
  .action:active { transform: translateY(1px); }
  .action.secondary {
    color: #eaf2ff; background: linear-gradient(135deg, #273850, #172235);
    box-shadow: 0 12px 30px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.12);
  }
  .action.secondary:focus { box-shadow: 0 0 0 4px rgba(91,158,255,.25), 0 16px 36px rgba(0,0,0,.38); }
  .action.done {
    color: #effff4; background: linear-gradient(135deg, #239d52, #126531);
    border-color: rgba(123,255,162,.55); box-shadow: 0 12px 30px rgba(24,142,67,.26);
    pointer-events: none;
  }
  #status { min-height: 1.5em; color: #9fb1c3; font-size: 18px; }
  @media (max-width: 650px) {
    #actions { width: 82vw; }
    .action { width: 100%; }
  }

  /* Cache indicator */
  #cache-bar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #111927; border: 1px solid #2a3650;
    border-radius: 12px; padding: 10px 16px;
    display: none; flex-direction: column; gap: 6px;
    min-width: 240px; max-width: 90vw;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
    z-index: 999;
  }
  #cache-bar.visible { display: flex; }
  #cache-label {
    font-size: 12px; color: #7c9ab8; letter-spacing: .04em;
    display: flex; justify-content: space-between;
  }
  #cache-track {
    width: 100%; height: 5px; background: #1e2d42;
    border-radius: 3px; overflow: hidden;
  }
  #cache-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #3b8cff, #47c76a);
    border-radius: 3px;
    transition: width .4s ease;
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="cat" src="slopkit/cat.jpg" alt="">
  <div id="actions">
    <a id="start" class="action"
       href="#" 
       onclick="window.location.href='slopkit/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=17'; return false;"
       tabindex="0">RUN</a>
  </div>
  <div id="status"></div>
</div>

<!-- Cache progress indicator -->
<div id="cache-bar">
  <div id="cache-label">
    <span id="cache-text">Caching for offline use…</span>
    <span id="cache-pct"></span>
  </div>
  <div id="cache-track"><div id="cache-fill"></div></div>
</div>

<script>
// Remove conflicting Service Workers
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
            registration.unregister();
        }
    });
}

try {
    var q = new URLSearchParams(location.search);
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("cat").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}

// Auto-Redirect Countdown Logic
var countdown = 5;
var startBtn = document.getElementById("start");

if (startBtn) {
    startBtn.innerText = "RUNNING IN " + countdown;
    var timer = setInterval(function() {
        countdown--;
        startBtn.innerText = "RUNNING IN " + countdown;
        
        if (countdown <= 0) {
            clearInterval(timer);
            window.location.href = 'slopkit/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=17';
        }
    }, 1000);
}

// AppCache indicator
try {
    var appCache = window.applicationCache;
    var bar      = document.getElementById("cache-bar");
    var fill     = document.getElementById("cache-fill");
    var text     = document.getElementById("cache-text");
    var pct      = document.getElementById("cache-pct");

    function showBar() { bar.classList.add("visible"); }
    function hideBar(delay) {
        setTimeout(function () { bar.classList.remove("visible"); }, delay || 0);
    }

    appCache.addEventListener("checking", function () {
        showBar();
        text.textContent = "Checking cache…";
        pct.textContent  = "";
        fill.style.width = "10%";
    });

    appCache.addEventListener("downloading", function () {
        showBar();
        text.textContent = "Caching for offline use…";
        fill.style.width = "20%";
    });

    appCache.addEventListener("progress", function (e) {
        showBar();
        if (e.lengthComputable && e.total > 0) {
            var p = Math.round((e.loaded / e.total) * 100);
            fill.style.width = p + "%";
            pct.textContent  = p + "%";
        } else {
            var cur = parseFloat(fill.style.width) || 20;
            fill.style.width = Math.min(cur + 3, 90) + "%";
        }
    });

    appCache.addEventListener("cached", function () {
        fill.style.width = "100%";
        text.textContent = "✓ Ready for offline use";
        pct.textContent  = "";
        fill.style.background = "#47c76a";
        hideBar(2800);
    });

    appCache.addEventListener("noupdate", function () {
        hideBar(0); 
    });

    appCache.addEventListener("obsolete", function () {
        showBar();
        text.textContent = "Cache cleared — reload to re-cache";
        pct.textContent  = "";
    });

    appCache.addEventListener("error", function () {
        alert("AppCache Error: A file in cache.appcache failed to load.");
        hideBar(0); 
    });

    if (!navigator.onLine) {
        showBar();
        text.textContent = "★ Offline mode";
        fill.style.width = "100%";
        fill.style.background = "#47c76a";
        pct.textContent  = "";
        hideBar(3000);
    }
} catch (e) {}
</script>

</body>
</html>
